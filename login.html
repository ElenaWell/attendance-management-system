<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Attendance Management System</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <!-- LOGIN HEADER -->

            <div class="login-header">

                <p class="eyebrow">
                    ATTENDANCE MANAGEMENT
                </p>

                <h1>
                    Welcome Back
                </h1>

                <p class="login-subtitle">
                    Sign in to access your attendance dashboard.
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="login-form">

                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <!-- PASSWORD VISIBILITY BUTTON -->

                        <button
                            type="button"
                            id="toggle-password"
                            class="toggle-password"
                            aria-label="Show password"
                        >

                            <!-- EYE: PASSWORD HIDDEN -->

                            <svg
                                class="eye-icon eye-visible"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true"
                            >

                                <path
                                    d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                />

                            </svg>


                            <!-- SLASHED EYE: PASSWORD VISIBLE -->

                            <svg
                                class="eye-icon eye-hidden"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true"
                            >

                                <path
                                    d="M3 3L21 21"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                />

                                <path
                                    d="M10.6 5.1C11.05 5.03 11.52 5 12 5C18.5 5 22 12 22 12C22 12 20.8 14.4 18.5 16.4"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />

                                <path
                                    d="M6.2 6.5C3.5 8.5 2 12 2 12C2 12 5.5 19 12 19C13.6 19 15 18.7 16.3 18.1"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- LOGIN ERROR -->

                <p
                    id="login-error"
                    class="login-error"
                    role="alert"
                    aria-live="polite"
                ></p>


                <!-- SIGN IN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In
                </button>

            </form>

        </section>

    </main>


    <script src="auth.js"></script>

</body>

</html>
